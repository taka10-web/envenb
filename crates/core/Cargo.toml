[package]
name = "envenb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EnvEnb core: domain models, SQLite persistence, and the application service layer."

[dependencies]
envenb-vault = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
secrecy = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
dirs = { workspace = true }
hmac = { workspace = true }
sha1 = "0.10"
arboard = { workspace = true, optional = true }

[features]
default = ["keychain"]
keychain = ["envenb-vault/keychain"]
clipboard = ["dep:arboard"]

[dev-dependencies]
tempfile = { workspace = true }
