[package]
name = "envenb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EnvEnb core: domain models, SQLite persistence, and the application service layer."

[dependencies]
envenb-vault = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
secrecy = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
dirs = { workspace = true }
hmac = { workspace = true }
sha1 = "0.10"
sha2 = { workspace = true }
rand = { workspace = true }
arboard = { workspace = true, optional = true }

# Device-owner authentication (Touch ID / login password) before widening
# access to a stored secret.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[features]
default = ["keychain"]
keychain = ["envenb-vault/keychain"]
clipboard = ["dep:arboard"]

[dev-dependencies]
tempfile = { workspace = true }
