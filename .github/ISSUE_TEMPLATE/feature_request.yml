name: Feature request
description: Something EnvEnb should be able to do and cannot.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        One constraint shapes every answer here: **no interface may return a
        secret value.** Not the CLI, not the desktop app, not MCP, not the
        local agent. A request that needs one will be declined however useful it
        is — see [SECURITY-DESIGN.md](../blob/main/docs/SECURITY-DESIGN.md).

        If you want a value for yourself, `envenb var copy` already does that
        (clipboard, cleared after 30 seconds, interactive terminal only).

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >-
        The task, not the feature. "I want X" is harder to act on than "I have
        to do Y, and the only way is Z, which is awkward because…".
      placeholder: >-
        I run three services that each need a different Postgres password, and
        I start them with one script.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: The workaround, if any, and where it falls short.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: >-
        Optional. A command, a flag, a screen. Leave it blank if you would
        rather describe the problem and let the design follow.

  - type: checkboxes
    id: secrets
    attributes:
      label: Secret handling
      options:
        - label: >-
            This does not require any interface to hand a secret value to an
            application, an AI agent, or a child process.
          required: true
