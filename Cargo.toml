[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/vault",
    "crates/daemon",
    "crates/cli",
    "crates/broker",
    "crates/mcp",
    "apps/desktop/src-tauri",
]
# `cargo build` / `cargo test` at the root cover the Rust crates. The Tauri app
# needs the built frontend (`pnpm build`) first, so it is built explicitly via
# `pnpm desktop:build` or `cargo build -p envenb-desktop`.
default-members = [
    "crates/core",
    "crates/vault",
    "crates/daemon",
    "crates/cli",
    "crates/broker",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/taka10-web/envenb"

[workspace.dependencies]
envenb-core = { path = "crates/core" }
envenb-vault = { path = "crates/vault" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
chacha20poly1305 = "0.10"
rand = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
tempfile = "3"
keyring = { version = "4", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
shell-words = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
arboard = { version = "3", default-features = false }
envenb-broker = { path = "crates/broker" }
envenb-mcp = { path = "crates/mcp" }
envenb-daemon = { path = "crates/daemon" }

[profile.release]
strip = true
lto = "thin"
